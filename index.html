          <main class="main"><p class="eyebrow">A little something, on-chain</p><h1 class="headline">Send a gift they’ll <em>actually keep.</em></h1><p class="sub">Digital Telegram-style gifts, purchased in seconds and delivered to any Robinhood wallet.</p>
            <section class="terminal"><div class="block"><span class="label">You pay</span><div class="row"><span class="amount">${selectedGift.price.split(" ")[0]}</span><div class="token-wrap"><button class="token" id="pay-token">${tokenIcon(selectedToken)}${selectedToken.symbol}${icon.down}</button>${menu==="pay"?tokenMenu(): ""}</div></div></div>
              <button class="switch" id="switch" aria-label="Switch assets">↕</button>
              <div class="block"><span class="label">You receive</span><div class="row"><span class="amount">1</span><div class="token-wrap"><button class="token" id="receive-token">${tokenIcon({symbol:"GIFT",icon:icon.heart})}GIFT${icon.down}</button>${menu==="receive"?giftMenu():""}</div></div></div>
              <div class="address"><label class="label" for="wallet">Your wallet address</label><input id="wallet" value="${window.walletValue||""}" placeholder="0x… or name.eth" autocomplete="off" spellcheck="false" class="${touched&&!valid?"invalid":""}" />${touched&&!valid?'<p class="error">Enter a valid Robinhood address (0x…) or ENS name (name.eth).</p>':'<p class="note">The gift will be sent to this address. <strong>We never store it.</strong></p>'}</div>
              <button class="gift" id="gift"><span class="gift-main">${giftArt(selectedGift)}<span class="gift-copy"><span class="gift-title">${selectedGift.name}</span><span class="gift-price">Floor: ${selectedGift.price}</span></span><span class="gift-chevron">${icon.down}</span></span><span class="gift-meta"><span>View <b>${selectedGift.listings}</b> available listings →</span><span class="rate">1 GIFT = ${selectedGift.price}</span></span></button>
              <button class="primary" id="buy" ${valid?"":"disabled"}>Select a Gift</button>
            </section><div class="foot">${icon.help}<button id="help">What is Cross-Chain Mode?</button></div><div class="micro"><span class="micro-row">${icon.lock} Non-custodial · settlement on Robinhood</span><span class="legal"><button id="terms">Terms</button>·<button id="privacy">Privacy</button></span></div>
          </main><div class="support">${support?'<div class="support-panel"><h3>Need a hand?</h3><p>Our small team monitors every delivery. Send us a note and include your order wallet if something feels off.</p><a href="mailto:hello@gifthod.xyz">hello@gifthod.xyz ↗</a></div>':""}<button class="support-button" id="support">${support?icon.close:icon.life}</button></div>${overlayHtml()}`;
        wire();
      }
      function tokenMenu(){return `<div class="menu">${tokens.map(t=>`<button data-token="${t.symbol}" class="${selectedToken.symbol===t.symbol?"selected":""}">${tokenIcon(t)}<span><b>${t.symbol}</b><small>${t.name}</small></span>${selectedToken.symbol===t.symbol?`<span class="check">${icon.check}</span>`:""}</button>`).join("")}</div>`}
      function giftMenu(){return `<div class="menu">${gifts.map(g=>`<button data-gift="${g.name}" class="${selectedGift.name===g.name?"selected":""}">${giftArt(g)}<span><b>${g.name}</b><small>${g.price}</small></span>${selectedGift.name===g.name?`<span class="check">${icon.check}</span>`:""}</button>`).join("")}</div>`}
      function overlayHtml(){if(overlay==="listings")return `<div class="backdrop"></div><aside class="drawer"><div class="drawer-head"><div><p class="eyebrow">Live marketplace</p><h2>Choose a gift</h2><p>Listings refresh as they move on Robinhood.</p></div><button class="close" id="close">${icon.close}</button></div>${gifts.map(g=>`<button class="listing" data-listing="${g.name}">${giftArt(g)}<span class="listing-info"><b>${g.name}</b><small>${g.listings} available · live listing</small></span><span class="listing-price">${g.price}</span>${g.name===selectedGift.name?`<span class="check">${icon.check}</span>`:""}</button>`).join("")}</aside>`;
        if(overlay==="help")return `<div class="backdrop"></div><section class="dialog"><div class="drawer-head"><div><p class="eyebrow">Network routing</p><h3>What is Cross-Chain Mode?</h3></div><button class="close" id="close">${icon.close}</button></div><p>Cross-Chain Mode lets Gifthod settle your purchase across supported networks while the gift is delivered to the wallet you provide.</p><ul><li>Your payment stays on the Robinhood network.</li><li>The recipient receives the collectible in their wallet.</li><li>A small routing fee is shown before you confirm.</li></ul><button class="secondary" id="close">Got it</button></section>`;
        if(overlay==="terms")return `<div class="backdrop"></div><section class="dialog"><div class="drawer-head"><div><p class="eyebrow">Legal</p><h3>Terms of Service</h3></div><button class="close" id="close" autofocus>${icon.close}</button></div><p>By using Gifthod you agree that purchases are final once confirmed on-chain, that gifts are delivered to the wallet address you provide exactly as entered, and that Gifthod is not responsible for funds sent to an incorrect or unsupported address.</p><ul><li>You must be legally able to hold and transfer digital assets in your jurisdiction.</li><li>Prices shown are indicative and may shift before you confirm.</li><li>Gifthod may suspend service for security or compliance reasons.</li></ul><button class="secondary" id="close">Close</button></section>`;
        if(overlay==="privacy")return `<div class="backdrop"></div><section class="dialog"><div class="drawer-head"><div><p class="eyebrow">Legal</p><h3>Privacy Policy</h3></div><button class="close" id="close" autofocus>${icon.close}</button></div><p>Gifthod does not store the wallet address you enter beyond completing your purchase. We do not collect names, emails, or payment details unless you contact support directly.</p><ul><li>On-chain transactions are public by nature of the network.</li><li>Support emails are kept only to resolve your inquiry.</li><li>We never sell or share your data with third parties.</li></ul><button class="secondary" id="close">Close</button></section>`;
        if(overlay==="confirm"){const a=document.querySelector("#wallet")?.value?.trim()||"";return `<div class="backdrop"></div><section class="dialog"><p class="eyebrow">Final review</p><h2>Ready to send the gift?</h2><p>Check the details below. Your purchase will be sent to the wallet exactly as entered.</p><div class="summary"><div class="summary-row"><span>Gift</span><strong>${selectedGift.name}</strong></div><div class="summary-row"><span>Amount</span><strong>${selectedGift.price.replace("RHN",selectedToken.symbol)}</strong></div><div class="summary-row"><span>Network</span><strong>Robinhood</strong></div><div class="summary-row"><span>To</span><strong>${a.endsWith(".eth")?a:a.slice(0,8)+"…"+a.slice(-6)}</strong></div></div><div class="actions"><button class="secondary" id="close">Back</button><button class="primary" id="confirm">Confirm purchase</button></div></section>`}

ps://x.com/Gifthod" target="_blank" rel="noopener noreferrer" aria-label="Gifthod on X">${icon.x}</a></span></header><main class="success"><section class="success-card"><div class="seal">${icon.check}</div><p class="eyebrow">Delivery confirmed</p><h1>Gift is on its way.</h1><p>${p?p.gift:"Your digital gift"} has been reserved and will arrive at the Robinhood wallet you provided.</p><div class="receipt"><span class="receipt-label">Transaction details</span><div class="summary-row"><span>Item</span><strong>${p?.gift||"Heart Locket"}</strong></div><div class="summary-row"><span>Paid</span><strong>${p?.amount||"22.99 ETH"}</strong></div><div class="summary-row"><span>Wallet</span><strong>${p?(p.address.endsWith(".eth")?p.address:p.address.slice(0,8)+"…"+p.address.slice(-6)):"Robinhood wallet"}</strong></div><div class="summary-row"><span>Status</span><strong style="color:var(--moss)">Processing</strong></div></div><button class="primary" id="home">←&nbsp; Send another gift</button></section></main>`;document.querySelectorAll("#home").forEach(b=>b.onclick=()=>{location.hash="";render()})}
      document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(overlay||menu)){overlay=null;menu=null;render()}});
      function wire(){
        document.querySelector("#pay-token")?.addEventListener("click",()=>{menu=menu==="pay"?null:"pay";render()});
        document.querySelector("#receive-token")?.addEventListener("click",()=>{menu=menu==="receive"?null:"receive";render()});
        document.querySelectorAll("[data-token]").forEach(b=>b.addEventListener("click",()=>{selectedToken=tokens.find(t=>t.symbol===b.dataset.token)||selectedToken;menu=null;render()}));
        document.querySelectorAll("[data-gift]").forEach(b=>b.addEventListener("click",()=>{selectedGift=gifts.find(g=>g.name===b.dataset.gift)||selectedGift;menu=null;render()}));
        document.querySelector("#gift")?.addEventListener("click",()=>{overlay="listings";render()});
        document.querySelectorAll("[data-listing]").forEach(b=>b.addEventListener("click",()=>{selectedGift=gifts.find(g=>g.name===b.dataset.listing)||selectedGift;overlay=null;render()}));
        document.querySelector("#help")?.addEventListener("click",()=>{overlay="help";render()});
        document.querySelector("#terms")?.addEventListener("click",()=>{overlay="terms";render()});
        document.querySelector("#privacy")?.addEventListener("click",()=>{overlay="privacy";render()});
        if(overlay){document.querySelector(".dialog .close, .drawer .close")?.focus()}
        document.querySelector("#buy")?.addEventListener("click",()=>{const a=document.querySelector("#wallet")?.value.trim()||"";if(WALLET_RE.test(a)){overlay="confirm";render()}else{touched=true;render()}});
        document.querySelector("#wallet")?.addEventListener("input",e=>{window.walletValue=e.target.value;document.querySelector("#buy").disabled=!WALLET_RE.test(e.target.value.trim())});
        document.querySelector("#wallet")?.addEventListener("blur",()=>{touched=true;render()});
        document.querySelectorAll("#close,.backdrop").forEach(b=>b.addEventListener("click",()=>{overlay=null;render()}));
        document.querySelector("#confirm")?.addEventListener("click",()=>{const address=document.querySelector("#wallet")?.value.trim()||"";sessionStorage.setItem("gifthod-purchase",JSON.stringify({gift:selectedGift.name,amount:selectedGift.price.replace("RHN",selectedToken.symbol),address}));location.hash="success";render()});
        document.querySelector("#support")?.addEventListener("click",()=>{support=!support;render()});
      }
      render();
    </script>
